<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>expedition list </h1>
    <ul>
        {% for expedition in list %}
            <li><a href="{% url 'ExpeditionApp:details' id=expedition.id %}">{{ expedition.reference }}</a> - {{ expedition.entreprise }}</li>
            {% empty %}
             </li>No expeditions found</li>
        {% endfor %}
    </ul>
</body>
</html>
